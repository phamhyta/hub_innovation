<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nguồn tự động – Dữ liệu Đổi mới sáng tạo</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/common.js"></script>
<script src="/static/illus.js"></script>
<style>
  .src-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .src-card { display: flex; flex-direction: column; gap: 10px; padding: 18px; }
  .src-card .hd { display: flex; align-items: center; gap: 12px; }
  .src-card .hd .tile { width: 40px; height: 40px; border-radius: 12px; flex: none; }
  .src-card h3 { margin: 0; font-size: 15px; line-height: 1.3; }
  .src-card .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .src-card .res { font-size: 13px; color: var(--text-2); min-height: 20px; }
  .src-card .ft { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
  .src-card.failed { border-color: #FECDCA; }
  .band { display: grid; grid-template-columns: 220px 1fr; align-items: center; gap: 20px; margin-bottom: 16px; padding: 8px 24px; background: linear-gradient(120deg, #fff 40%, #EEF4FF); }
  .band-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .band-stats .v { display: block; font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
  .band-stats .l { font-size: 13px; color: var(--text-2); }
  @media (max-width: 760px) { .band { grid-template-columns: 1fr; text-align: center; } .band-art svg { width: 180px; } .band-stats { grid-template-columns: 1fr 1fr 1fr; } .band-stats .v { font-size: 24px; } }
</style>
</head>
<body>
<main>
  <button class="btn primary ph-actions" id="runAll"></button>
  <section class="card band"><div class="band-art" id="globe" aria-hidden="true"></div>
    <div class="band-stats"><div><span class="v" id="bSrc">7</span><span class="l">Nguồn dữ liệu</span></div><div><span class="v" id="bOk">–</span><span class="l">Lần thu thập thành công</span></div><div><span class="v" id="bPts">–</span><span class="l">Số liệu thu thập gần nhất</span></div></div></section>
  <div class="src-grid" id="cards"></div>
  <h2 class="section">Lịch sử chạy</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th style="width:60px">#</th><th>Nguồn</th><th>Trạng thái</th><th>Kết quả</th><th class="hide-sm">Lúc</th><th class="num hide-sm">Thời gian</th></tr></thead>
      <tbody id="runs"></tbody>
    </table>
  </div>
</main>
<script>
renderHeader("/connectors");
$("runAll").innerHTML = ic("play") + "Chạy tất cả";
$("globe").innerHTML = ILLUS.globe({ w: 210 });
const STAT_LABEL = { documents: "tài liệu", new: "mới", updated: "đổi", unchanged: "không đổi", published: "công bố", needs_review: "chờ duyệt", skipped: "bỏ qua", derived_computed: "tự tính" };
const statsText = (s) => Object.entries(s || {}).filter(([k, v]) => v && k !== "documents").map(([k, v]) => `${v.toLocaleString("vi-VN")} ${STAT_LABEL[k] || k}`).join(" · ");
const dur = (r) => r.finished_at ? ((new Date(r.finished_at + (r.finished_at.endsWith("Z") ? "" : "Z")) - new Date(r.started_at + (r.started_at.endsWith("Z") ? "" : "Z"))) / 1000).toFixed(1) + " s" : "";
const ago = (t) => { if (!t) return ""; const s = (Date.now() - new Date(t + (t.endsWith("Z") ? "" : "Z"))) / 1000; return s < 3600 ? `${Math.max(1, Math.round(s / 60))} phút trước` : s < 86400 ? `${Math.round(s / 3600)} giờ trước` : `${Math.round(s / 86400)} ngày trước`; };
const TILES = ["t1", "t2", "t3", "t4"];
$("cards").innerHTML = Array.from({ length: 6 }, () => '<div class="card"><div class="skel" style="height:120px"></div></div>').join("");

async function load() {
  const [cs, runs] = await Promise.all([api("/api/connectors"), api("/api/crawl-runs?limit=30")]);
  const okN = cs.filter((c) => (c.last_run || {}).status === "success").length;
  const pts = cs.reduce((a, c) => a + (((c.last_run || {}).stats || {}).new || 0) + (((c.last_run || {}).stats || {}).unchanged || 0), 0);
  $("bSrc").textContent = cs.length; $("bOk").textContent = `${okN}/${cs.length}`; $("bPts").textContent = pts.toLocaleString("vi-VN");
  const failedFirst = [...cs].sort((a, b) => ((b.last_run || {}).status === "failed") - ((a.last_run || {}).status === "failed"));
  $("cards").innerHTML = failedFirst.map((c, i) => {
    const r = c.last_run, failed = r && r.status === "failed";
    return `<section class="card src-card ${failed ? "failed" : ""}">
      <div class="hd"><span class="tile ${TILES[i % 4]}">${ic("zap")}</span><div style="min-width:0" title="${esc(c.title)} – ${esc(c.description)}"><h3>${esc(SOURCE_NAMES[c.name] || c.title)}</h3></div></div>
      <div class="meta">${c.indicators.map((x) => `<a class="code" href="/indicator?code=${encodeURIComponent(x)}">${esc(x)}</a>`).join("")}${conf(c.confidence)}<span class="tag">${c.auto_publish ? "Tự công bố" : "Cần duyệt"}</span></div>
      <div class="res" title="${esc(c.description)}">${r ? (failed ? `<span class="err-text">${esc(r.error)}</span>` : esc(statsText(r.stats)) || "Không có thay đổi") : '<span class="muted">Chưa chạy</span>'}${r && r.stats && r.stats.needs_review ? ` · <a href="/review?crawl_run_id=${r.id}&geography=*">duyệt</a>` : ""}</div>
      <div class="ft"><span>${r ? status(r.status) + ` <span class="small muted">${ago(r.started_at)}</span>` : ""}</span>
        <span style="display:flex;gap:6px"><a class="icon-btn" style="width:32px;height:32px" href="${esc(c.home_url)}" target="_blank" rel="noopener" title="Trang nguồn" aria-label="Trang nguồn">${ic("ext")}</a>
        <button class="btn sm" data-run="${esc(c.name)}">${ic("play")}Chạy</button></span></div>
    </section>`;
  }).join("");
  $("runs").innerHTML = runs.map((r) => `<tr><td><span class="code">${r.id}</span></td><td>${esc(r.connector.startsWith("ext:") ? "Dữ liệu ngoài · " + r.connector.slice(4) : (SOURCE_NAMES[r.connector] || r.connector))}</td><td>${status(r.status)}</td>
    <td class="small">${r.error ? `<span class="err-text">${esc(r.error.slice(0, 120))}</span>` : esc(statsText(r.stats))}</td><td class="hide-sm small muted">${when(r.started_at)}</td><td class="num hide-sm small">${dur(r)}</td></tr>`).join("")
    || `<tr><td colspan="6">${emptyState("Chưa có lần chạy nào")}</td></tr>`;
  document.querySelectorAll("[data-run]").forEach((b) => b.onclick = () => run(b.dataset.run, b));
}

async function run(name, btn) {
  if (btn) { btn.disabled = true; btn.innerHTML = ic("refresh") + "Đang chạy…"; }
  try {
    const r = await api(`/api/connectors/${encodeURIComponent(name)}/run`, { method: "POST" });
    toast(`${SOURCE_NAMES[name] || name}: ${STATUS[r.status]}${r.error ? " – " + r.error : ""}`, r.status === "failed" ? { type: "err" } : {});
  } catch (e) { toast(`${name}: ${e.message}`, { type: "err" }); }
  await load(); refreshBadge();
}

$("runAll").onclick = async () => {
  $("runAll").disabled = true;
  const cs = await api("/api/connectors");
  for (const c of cs) await run(c.name, document.querySelector(`[data-run="${c.name}"]`));
  $("runAll").disabled = false;
};

load().catch((e) => toast("Không tải được dữ liệu: " + e.message, { type: "err" }));
</script>
</body>
</html>
