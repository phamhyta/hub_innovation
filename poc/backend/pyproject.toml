[project]
name = "innovation-hub-backend"
version = "0.1.0"
description = "PoC Innovation Hub - số hoá & tự động hoá bộ chỉ tiêu KH,CN, ĐMST"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
