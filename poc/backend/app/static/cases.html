<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đánh giá chương trình – Dữ liệu Đổi mới sáng tạo</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/common.js"></script>
<script src="/static/illus.js"></script>
</head>
<body>
<main>
  <a class="btn primary ph-actions" href="#f" id="newBtn">Tạo mới</a>
  <div class="table-wrap">
    <table>
      <thead><tr><th>#</th><th>Chương trình</th><th>Giai đoạn</th><th class="num">Điểm</th><th>Kết luận</th><th class="num">Tiêu chí có điểm</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <h2 class="section">Tạo hồ sơ đánh giá</h2>
  <form id="f" class="card edit">
    <label class="full">Tên chương trình<input class="field" name="name" required minlength="3"></label>
    <label class="full">Tóm tắt kết quả<textarea class="field" name="description" rows="3" placeholder="Dùng để gợi ý mức TRL"></textarea></label>
    <label>Từ năm<input class="field" name="year_from" type="number" min="1990" max="2100"></label>
    <label>Đến năm<input class="field" name="year_to" type="number" min="1990" max="2100"></label>
    <label>Kinh phí (tỷ đồng)<input class="field" name="budget_billion_vnd" type="number" step="any" min="0"></label>
    <label>&nbsp;</label>
    <label class="full">DOI bài báo<textarea class="field" name="dois" rows="4" placeholder="Mỗi dòng một DOI, vd. 10.1016/j.xxx.2023.01.001"></textarea></label>
    <label class="full">Tác giả OpenAlex<textarea class="field" name="author_ids" rows="2" placeholder="Mỗi dòng một mã A…, dùng tính h-index"></textarea></label>
    <label class="full">Văn bằng SHTT<textarea class="field" name="patents" rows="2" placeholder="số | SC/HI | filed/accepted/granted | tên"></textarea></label>
    <div class="full small muted">Mục tiêu (để trống = mặc định)</div>
    <label>Số bài quốc tế<input class="field" name="t_articles" type="number" step="any"></label>
    <label>Hợp tác quốc tế (%)<input class="field" name="t_intl_collab_pct" type="number" step="any"></label>
    <label>Trích dẫn TB/bài<input class="field" name="t_citations_per_article" type="number" step="any"></label>
    <label>H-index trung vị<input class="field" name="t_h_index" type="number" step="any"></label>
    <label>Kinh phí/bài tối đa<input class="field" name="t_budget_per_article" type="number" step="any"></label>
    <label>TRL mục tiêu<input class="field" name="t_trl" type="number" min="1" max="9"></label>
    <label>Đơn SHTT<input class="field" name="t_patent_applications" type="number"></label>
    <label>Văn bằng được cấp<input class="field" name="t_patents_granted" type="number"></label>
    <div class="full"><button class="btn primary">Tạo hồ sơ</button> <span id="msg" class="small"></span></div>
  </form>
</main>
<script>
renderHeader("/cases");

async function load() {
  const cs = await api("/api/cases");
  $("rows").innerHTML = cs.map((c) => `<tr class="click" onclick="location.href='/case?id=${c.id}'">
    <td>${c.id}</td><td><b>${esc(c.name)}</b>${c.demo ? ' <span class="tag">giả lập</span>' : ""}</td><td>${esc(c.period || "")}</td>
    <td class="num"><b>${c.overall != null ? c.overall.toFixed(1) : "–"}</b></td>
    <td>${esc(c.verdict)}${c.provisional ? ' <span class="status st-needs_review">tạm tính</span>' : ""}</td>
    <td class="num">${c.coverage.scored}/${c.coverage.total}</td></tr>`).join("")
    || '<tr><td colspan="6" class="muted">Chưa có hồ sơ đánh giá. Tạo hồ sơ mới ở phần bên dưới.</td></tr>';
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target), num = (k) => fd.get(k) ? Number(fd.get(k)) : null, targets = {};
  for (const [k, v] of fd.entries()) if (k.startsWith("t_") && v !== "") targets[k.slice(2)] = Number(v);
  const patents = (fd.get("patents") || "").split("\n").map((l) => l.split("|").map((x) => x.trim())).filter((p) => p[0])
    .map(([number, kind, status, title]) => ({ number, kind: (kind || "SC").toUpperCase(), status: (status || "filed").toLowerCase(), title: title || null }));
  const body = { name: fd.get("name"), description: fd.get("description") || null, year_from: num("year_from"), year_to: num("year_to"),
    budget_billion_vnd: num("budget_billion_vnd"), dois: fd.get("dois"), author_ids: fd.get("author_ids"), targets, patents };
  try {
    const r = await api("/api/cases", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    location.href = `/case?id=${r.id}&compute=1` + (r.warnings.length ? `&warn=${encodeURIComponent(r.warnings.join("; "))}` : "");
  } catch (err) { $("msg").innerHTML = `<span class="err-text">${esc(err.message)}</span>`; }
});
load();
</script>
</body>
</html>
