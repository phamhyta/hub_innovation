name: innovation-hub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-innovation_hub}
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-innovation_hub}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dự phòng cho kho file minh chứng dạng S3 – PoC hiện lưu file vào ./data/storage (chưa dùng MinIO)
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hubadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hub_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hub_dev_password}@db:5432/${POSTGRES_DB:-innovation_hub}
      WORKBOOK_PATH: /data/raw/indicator_survey.xlsx
      TEMPLATES_DIR: /templates
      STORAGE_DIR: /data/storage        # snapshot crawl + file upload (MinIO thay thế ở bản sau)
      ENABLE_SCHEDULER: "true"          # connector chạy định kỳ 3h sáng thứ Hai
    volumes:
      - ./data:/data
      - ./templates:/templates
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
